name: Browser acceptance for the live Miraflores guides
on:
  push:
    branches: [verify-miraflores-production-157]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.56.0
      - run: python .github/verify-miraflores-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miraflores-desktop-mobile-browser-evidence
          path: browser-evidence
          retention-days: 30
