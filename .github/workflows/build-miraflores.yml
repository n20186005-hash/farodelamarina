name: Build and verify Miraflores static export
on:
  push:
    branches: [build-miraflores-157]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: test $(find out -path '*/nearby/*' -name '*.html' | wc -l) -ge 124
