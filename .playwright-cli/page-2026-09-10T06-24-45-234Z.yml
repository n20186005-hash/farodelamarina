  - generic [ref=e175]:
    - generic [ref=e176]:
      - paragraph [ref=e177]: "03"
      - heading "灯塔的光学与工程原理" [level=2] [ref=e178]
    - paragraph [ref=e181]: 灯塔既是建筑，也是一台光学仪器。理解光如何被聚集、如何被识别、塔身为何这样造，才能看懂这座铁塔背后的技术逻辑。以下内容为通用的灯塔科学原理，适用于理解本类历史航标。
    - generic [ref=e183]:
      - article [ref=e184]:
        - generic [aria-hidden] [ref=e185]: 🔍
        - heading "菲涅尔透镜带来的革命" [level=3] [ref=e186]
        - paragraph [ref=e187]: 19 世纪以前，灯塔依靠抛光金属反射镜聚光，大量光线在反射与散射中损失。1822 年问世的菲涅尔透镜改用同心棱镜环，把发散的光线折射、反射成接近水平的平行光束，亮度大幅提升、镜体却更轻更薄。正是这项技术让大型海岸灯塔成为可能，也让 19 世纪末的灯塔普遍采用这种光学系统。
      - article [ref=e188]:
        - generic [aria-hidden] [ref=e189]: 📏
        - heading "两个射程：地理射程与光视距" [level=3] [ref=e190]
        - paragraph [ref=e191]: 灯塔的可见距离由两个因素中较小的一个决定。地理射程受地球曲率限制——灯高与观测者眼高共同决定能看到多远；光视距则取决于灯光强度与当时的大气能见度。因此「18 海里」这类指标属于理想条件下的量级，实际看到多远往往由雾气、雨幕和浪花决定。
      - article [ref=e192]:
        - generic [aria-hidden] [ref=e193]: 🔆
        - heading "灯质：灯塔在海上的身份证" [level=3] [ref=e194]
        - paragraph [ref=e195]: 海图上标注的不是灯塔的样子，而是它的明暗节奏。通过闪光、暗歇与间隔的组合（称为「灯质」），相邻的两座灯塔可以完全区分开，航海者在没有电子设备的年代也能靠数闪光来确认自己看到的是哪一座。这是导航史上最早的「编码识别」实践。
      - article [ref=e196]:
        - generic [aria-hidden] [ref=e197]: 🔩
        - heading "铸铁分段：可拆卸的工程智慧" [level=3] [ref=e198]
        - paragraph [ref=e199]: 19 世纪的塔身常在工厂里预制成一圈圈编号铸铁构件，平板打包、海运到岸、现场用法兰螺栓拼装。这种建造方式运输成本低、施工周期短，最关键的是可逆——结构如同巨大的立体拼图，可以完整拆开再在别处复原，这正是这座灯塔能在数十年后被整体搬迁的前提。
      - article [ref=e200]:
        - generic [aria-hidden] [ref=e201]: 🧭
        - heading "坐标、地址网格与 Plus Code" [level=3] [ref=e202]
        - paragraph [ref=e203]: 同一处地点同时拥有几套「地址」：经纬度坐标、城市街道门牌，以及像 VXG5+GW 这样的 Plus Code（开放位置代码）。Plus Code 把地球表面切成层层嵌套的方格，即便当地没有门牌系统，也能把位置精确到几米之内。同时公布多种编码，能让紧急救援与地图导航都快速定位到同一地点。
  - generic [ref=e204]:
    - generic [ref=e205]:
      - paragraph [ref=e206]: "04"
      - heading "纪念广场与海军荣誉" [level=2] [ref=e207]
    - paragraph [ref=e210]: 灯塔所在的公园是一个集技术和自然景观于一体的公共空间，设有多位秘鲁海军历史重要人物的纪念雕像与铭文，供后人瞻仰：
    - generic [ref=e212]:
      - generic [ref=e213]:
        - generic [ref=e214]: "1"
        - heading "马丁·豪尔赫·吉斯 中将 (Vicealmirante Martín Jorge Guise, 1780-1828)" [level=4] [ref=e215]
        - paragraph [ref=e216]: 秘鲁海军创始人，共和国第一任海军上将。1828年11月24日，他在“总统号”护卫舰上为保卫这片收养他的祖国而献出生命。其家族座右铭为：“最诚实，最安全”（QUO HONESTIOR EO TUTIOR）。
      - generic [ref=e217]:
        - generic [ref=e218]: "2"
        - heading "胡安·曼努埃尔·范宁·加西亚 海军上尉 (Capitán de Navío Juan Manuel Fanning García)" [level=4] [ref=e219]
        - paragraph [ref=e220]: 在1881年1月15日的米拉弗洛雷斯战役中表现英勇并受致命重伤。他为秘鲁人民留下了不朽的牺牲榜样，以及那句著名的口号：“前进，海军，前进！”(¡ADELANTE MARINA ADELANTE!)。
  - generic [ref=e221]:
    - generic [ref=e222]:
      - paragraph [ref=e223]: "05"
      - heading "大事记：一座铁塔的迁徙" [level=2] [ref=e224]
    - paragraph [ref=e227]: 以下年表依据站内记载与公开航海资料整理。凡属推断或存在争议的细节，文中均已明确标注。
    - list [ref=e229]:
      - listitem [ref=e230]:
        - generic [ref=e231]: 1860s–1890s
        - generic [ref=e232]:
          - heading "一条需要「眼睛」的海岸" [level=3] [ref=e233]
          - paragraph [ref=e234]: 随着蒸汽航运与硝石、鸟粪石贸易的发展，秘鲁太平洋沿岸的船舶流量大幅增长。在无线电出现之前，一座位置精确、夜间点亮的灯塔，是船只在夜里确认自身位置最可靠的手段。
      - listitem [ref=e235]:
        - generic [ref=e236]: "1900"
        - generic [ref=e237]:
          - heading "在科莱斯角（Punta Coles）落成" [level=3] [ref=e238]
          - paragraph [ref=e239]: 这座塔身由 Chance Bros 制造，于 1900 年建成于莫克瓜大区伊洛港以南的科莱斯角，开始为秘鲁南部海域的船只提供定位与避障指引。
      - listitem [ref=e240]:
        - generic [ref=e241]: 1900–1973
        - generic [ref=e242]:
          - heading "南方海域的七十年" [level=3] [ref=e243]
          - paragraph [ref=e244]: 在长达七十余年的时间里，这座灯塔持续标定着南部航路。守塔人每夜的例行工作是修剪灯芯、擦拭镜面、记录气象——这是当时海岸基础设施中最不起眼却最不能中断的一环。
      - listitem [ref=e245]:
        - generic [ref=e246]: "1973"
        - generic [ref=e247]:
          - heading "被逐件拆解" [level=3] [ref=e248]
          - paragraph [ref=e249]: 在原址完成历史使命后，秘鲁海军水文航海局（DHNM）选择保存而非拆除这座铁塔，将其按编号逐件拆解，以便向北运输。
      - listitem [ref=e250]:
        - generic [ref=e251]: 1973 年 12 月
        - generic [ref=e252]:
          - heading "在米拉弗洛雷斯重新立起" [level=3] [ref=e253]
          - paragraph [ref=e254]: 灯塔在米拉弗洛雷斯的 Malecón Cisneros 崖顶重新组装完成，成为海军灯塔公园（Parque El Faro de la Marina），用以纪念秘鲁航海史的一百周年，也为首都留下了一座属于本国航海事业的纪念物。
      - listitem [ref=e255]:
        - generic [ref=e256]: 此后数十年
        - generic [ref=e257]:
          - heading "从航标到城市纪念地" [level=3] [ref=e258]
          - paragraph [ref=e259]: 随着海滨长廊逐渐成为利马的城市客厅，这座塔也从一座纯功能性航标，转变为观景平台与市政仪式的场所，塔基周围相继设立了纪念铭牌，向公众讲述它自身的迁移史。
      - listitem [ref=e260]:
        - generic [ref=e261]: 今天
        - generic [ref=e262]:
          - heading "仍在原处守望太平洋" [level=3] [ref=e263]
          - paragraph [ref=e264]: 场地全天候免费开放。铁塔依旧矗立崖顶，而它脚下的广场已是俯瞰太平洋、观看日落与举行纪念活动的公共空间。
  - generic [ref=e265]:
    - generic [ref=e266]:
      - paragraph [ref=e267]: "06"
      - heading "传说与民间故事" [level=2] [ref=e268]
    - generic [ref=e270]:
      - paragraph [ref=e271]: 传说是一座纪念物被记忆的方式之一。以下故事来自游客与本地居民的口耳相传，我们保留它们，但明确标注其性质——这是科普与遗产导览应有的分寸。
      - paragraph [ref=e272]: 本节内容属于民间传说与都市传闻，不构成史实陈述。我们有意把「可考证的事实」与「被反复讲述的故事」分开呈现：这正是本站作为非营利科普网站的基本编辑准则。
    - generic [ref=e274]:
      - article [ref=e275]:
        - generic [aria-hidden] [ref=e276]: 🗼
        - heading "埃菲尔设计的传说" [level=3] [ref=e277]
        - paragraph [ref=e278]: 关于这座深蓝色铁塔最广为人知的说法，是它出自法国工程师古斯塔夫·埃菲尔（埃菲尔铁塔的设计者）之手。这一说法在导览与游记中被反复引用，但至今没有档案文献能够支持；目前可追溯的记录指向其实际制造厂商。传说之所以顽强，是因为它抓住了一个真实的印象：这座塔的铆接铁构，与 19 世纪末那批钢铁工程师的作品确实属于同一个技术世界。
      - article [ref=e279]:
        - generic [aria-hidden] [ref=e280]: 🌊
        - heading "灯塔是「岸上的最后一只手」" [level=3] [ref=e281]
        - paragraph [ref=e282]: 在许多港口文化中，灯塔都被赋予守护者的意味——它不说话，只是整夜把光推向海面。水手家属把它当作岸上仍在等候的象征，出航前到塔下停留片刻。这类情感并非某地独有，却很好地解释了为什么一座纯功能的建筑会被城市当作纪念物来珍视。
      - article [ref=e283]:
        - generic [aria-hidden] [ref=e284]: 🕯️
        - heading "守塔人的传说" [level=3] [ref=e285]
        - paragraph [ref=e286]: 本地流传的一则故事讲，某位守塔人在风暴之夜拒绝离岗，用手一寸寸守着灯火，好让返航的船只找到入口。故事的年代与主人翁姓名在不同版本中互相矛盾，唯一被稳定复述的细节是「那一夜灯没有熄」。它更像一则关于职责的寓言，而不是一份记录——却恰好映照出守塔工作真实而无趣的一面：整夜记录、擦拭、修剪，重复到无人注意。
      - article [ref=e287]:
        - generic [aria-hidden] [ref=e288]: 🎨
        - heading "为什么是深蓝色" [level=3] [ref=e289]
        - paragraph [ref=e290]: 塔身为何是深蓝色？民间给出过几种解释：与搬移它的海军机构身份呼应、与太平洋的海色呼应、或为了在天空中形成更清晰的轮廓。三种说法都合理，但没有一种能作为原始依据被证实。颜色因此成了一桩小小的谜，也成了这座纪念物最难被混淆的识别特征。
  - generic [ref=e291]:
    - generic [ref=e292]:
      - paragraph [ref=e293]: "07"
      - heading "崖顶之上的自然与气候" [level=2] [ref=e294]
    - paragraph [ref=e297]: 灯塔恰好站在「沙漠城市」与「地球上最丰饶的海域之一」的交界处。它的景观与气候，都由这个位置决定。
    - generic [ref=e299]:
      - article [ref=e300]:
        - generic [aria-hidden] [ref=e301]: 🪨
        - heading "海岸崖壁与「下崖」地形" [level=3] [ref=e302]
        - paragraph [ref=e303]: 利马的海岸是一条连续的陡崖，沙漠平原在这里直接跌落至太平洋。米拉弗洛雷斯就坐落在这道崖坎的顶端，因此一座 22 米高的铁塔在此获得的地平线视野，通常是更高建筑才能拥有的。
      - article [ref=e304]:
        - generic [aria-hidden] [ref=e305]: 🌫️
        - heading "garúa：利马的灰色季节" [level=3] [ref=e306]
        - paragraph [ref=e307]: 大约每年 5 月至 11 月，利马被低而湿润的海岸雾覆盖，当地人称为 garúa。潮湿空气经过冷洋面时降温到露点以下，形成持续的阴天与毛毛雨，这就是「利马永远阴天」印象的来源。到了夏季（12 月至次年 4 月），雾层抬升消散，海岸迎来强烈的直射阳光。
      - article [ref=e308]:
        - generic [aria-hidden] [ref=e309]: 🐟
        - heading "洪堡洋流带来的生命" [level=3] [ref=e310]
        - paragraph [ref=e311]: 近岸海水异常寒冷，原因是从南向北输送副南极水的洪堡洋流（秘鲁寒流）。冷水富含营养物质，支撑起庞大的浮游生物繁殖，进而养育了世界上最丰产的渔场之一，也让这一带的海面终年群鸟盘旋——海水的温度，决定了整条食物链。
      - article [ref=e312]:
        - generic [aria-hidden] [ref=e313]: 🦅
        - heading "不用出海就能看到的野生动物" [level=3] [ref=e314]
        - paragraph [ref=e315]: 冷水带来的饵料让海鸟贴近岸边活动。在崖顶可以观察鹈鹕、鸬鹚、鲣鸟与海鸥在水面上盘旋俯冲；沿海南行到海湾处，还常能见到海狮。对于旅行者而言，这里是利马最容易接触海岸生态的位置之一。
      - article [ref=e316]:
        - generic [aria-hidden] [ref=e317]: 📐
        - heading "地震带上的工程课" [level=3] [ref=e318]
        - paragraph [ref=e319]: 秘鲁位于板块汇聚边界，利马的崖壁与岬角既是缓慢抬升的结果，也被历次地震反复重塑。这座灯塔用螺栓连接的铁构与落在岩层上的基础，正是工程师面对地震带时最朴素的三条原则：轻、柔、坐落在坚实的基础上。
      - article [ref=e320]:
        - generic [aria-hidden] [ref=e321]: 🌇
        - heading "日落与海雾的两种黄昏" [level=3] [ref=e322]
        - paragraph [ref=e323]: 夏季这一段海岸几乎正对日落方向，洁净的海洋空气让色彩格外饱和；而在 garúa 季节，太阳多在半途隐入云层，得到的是柔和、低对比的漫射光。同一条长廊，一年中有两种完全不同的黄昏。
