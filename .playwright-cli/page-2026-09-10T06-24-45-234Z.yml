    - generic [ref=e68]:
      - article [ref=e69]:
        - heading "关于 Navy Lighthouse（海军灯塔）" [level=2] [ref=e70]
        - paragraph [ref=e71]:
          - strong [ref=e72]: Navy Lighthouse
          - text: （西班牙语：
          - strong [ref=e73]: Faro de la Marina
          - text: ）是一座高 72 英尺（约 22 米）的崖畔铸铁灯塔，位于秘鲁米拉弗洛雷斯 15074 区 Cisneros 海滨大道 18 号（Mal. Cisneros 18）。其白色灯光射程可达 18 海里（约 33 公里），是利马访问量最大的灯塔与最佳免费公共观景台。
      - article [ref=e74]:
        - heading "Faro de la Marina 的位置与游览方式（米拉弗洛雷斯）" [level=2] [ref=e75]
        - paragraph [ref=e76]: 灯塔位于 Cisneros 海滨步道（Malecón Cisneros）上，Plus Code 为 VXG5+GW，从米拉弗洛雷斯中心的肯尼迪公园步行约 15 分钟即可抵达。公园免费开放、全年 24 小时可进入，日落时分人气最高。可使用下方地图获取实时导航。
      - article [ref=e77]:
        - heading "Faro de la Marina 周边地标与景点" [level=2] [ref=e78]
        - paragraph [ref=e79]:
          - text: 参观
          - strong [ref=e80]: Navy Lighthouse
          - text: 时，游客可轻松探索周边的历史地标与景点，包括
          - strong [ref=e81]: 爱情公园（Parque del Amor）
          - text: 与
          - strong [ref=e82]: 拉尔科马购物中心（Larcomar）
          - text: ，沿米拉弗洛雷斯海滨步行皆可到达。
      - article [ref=e83]:
        - heading "Navy Lighthouse 的历史与意义" [level=2] [ref=e84]
        - paragraph [ref=e85]: 灯塔由瑞典 Chance Bros 公司于 1900 年在莫克瓜 Punta Coles 建成，1973 年 12 月由秘鲁海军水文航海局（DHNM）拆解并重新组装于米拉弗洛雷斯的悬崖之上，以纪念秘鲁航海史一百周年。
  - generic [ref=e86]:
    - generic [ref=e87]:
      - paragraph [ref=e88]: "01"
      - heading "历史渊源与传奇身世" [level=2] [ref=e89]
    - paragraph [ref=e92]: 海军灯塔（西班牙语：Faro de la Marina）不仅是秘鲁首都利马最著名、访问量最大的灯塔，更是一座承载了百年航海记忆的工业文物。与许多人的直觉不同，这座标志性建筑最初并非矗立于米拉弗洛雷斯的悬崖之上。
    - generic [ref=e93]:
      - heading "从南部港口到首都悬崖" [level=3] [ref=e94]
      - paragraph [ref=e95]: 灯塔的建造最初受委托于瑞典的 Chance Bros 公司，并于1900年落成于莫克瓜大区（Moquegua）伊洛港以南的科莱斯角（Punta Coles）。它在南部海域为往来船只指引了半个多世纪的航向。直到1973年12月，秘鲁海军水文航海局（DHNM）将其精心拆解，并跨越数百公里重新组装在利马米拉弗洛雷斯的现址——海军灯塔公园（Parque el Faro），以此纪念秘鲁航海史的一百周年。
    - generic [ref=e97]:
      - generic [ref=e101]:
        - generic [ref=e102]: 💡
        - heading "你知道吗？建筑谜团与都市传说" [level=3] [ref=e103]
      - paragraph [ref=e104]: 关于这座深蓝色铁塔，民间一直流传着一个著名的都市传说：许多人坚信这座灯塔是由法国著名工程师古斯塔夫·埃菲尔（Gustave Eiffel，埃菲尔铁塔的设计者）所设计的。尽管这一说法在游客中广为流传，但迄今为止并没有确凿的文献记录能支持这一观点，为其平添了一抹神秘色彩。
  - generic [ref=e105]:
    - generic [ref=e106]:
      - paragraph [ref=e107]: "02"
      - heading "建筑构造与技术规格" [level=2] [ref=e108]
    - paragraph [ref=e111]: 海军灯塔完美融合了维多利亚时代的工业美学与现代航海技术。灯塔正下方深色的金属铭牌记录了其详细的物理参数：
    - generic [ref=e113]:
      - generic [ref=e114]:
        - heading "🏗️ 建筑结构" [level=4] [ref=e115]
        - paragraph [ref=e116]: 塔高22米，矗立于海拔86米的太平洋海岸悬崖之上，总焦高达到108米。
      - generic [ref=e117]:
        - heading "⚙️ 工业设计" [level=4] [ref=e118]
        - paragraph [ref=e119]: 塔身由319个可拆卸的铸铁部件和1,750个连接螺栓精密组装而成，总重量达60,000公斤。外部采用深海军蓝色涂装，并配有两条醒目的白色水平条纹。
      - generic [ref=e120]:
        - heading "✨ 光学性能" [level=4] [ref=e121]
        - paragraph [ref=e122]: 灯塔拥有 83,000 坎德拉的亮度。其白光闪烁模式（每15秒闪烁三次）在无雾天气下的可视射程可达 18 海里（约 33 公里）。
