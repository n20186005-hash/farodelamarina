      - paragraph [ref=e618]: 本站是非营利的科普导览，只说明纪念地周边的设施类型与分布规律，不推荐、不排序、不背书任何具体商户。请根据自身需求与现场情况自行选择。
    - generic [ref=e620]:
      - article [ref=e621]:
        - generic [aria-hidden] [ref=e622]: 🚻
        - heading "公共卫生间" [level=3] [ref=e623]
        - paragraph [ref=e624]: 海滨长廊沿线与内街商业中心内通常都设有公共卫生间。与其他公共场所一样，随身携带纸巾、并为零钱付费式服务略作准备，是比较稳妥的习惯。
      - article [ref=e625]:
        - generic [aria-hidden] [ref=e626]: 🅿️
        - heading "停车" [level=3] [ref=e627]
        - paragraph [ref=e628]: 停车供给大致由三部分组成：长廊沿线的路边收费车位、内街商业中心的地下收费停车场，以及出租车与旅游巴士使用的临时上下客点。周末与日落前后车位最紧张，早到通常比绕行更省时间。
      - article [ref=e629]:
        - generic [aria-hidden] [ref=e630]: 🍽️
        - heading "餐饮" [level=3] [ref=e631]
        - paragraph [ref=e632]: 周边餐饮层次齐全：海景餐厅、咖啡与烘焙店、简餐与外卖、以及长廊上的冰淇淋与鲜果汁摊。在公共长椅上自带食物小憩在当地十分常见，也被普遍接受。
      - article [ref=e633]:
        - generic [aria-hidden] [ref=e634]: 🏨
        - heading "住宿" [level=3] [ref=e635]
        - paragraph [ref=e636]: 步行可达范围内有精品酒店、国际连锁商务酒店、青年旅舍与短租公寓等多种类型。夏季与长假期建议提前预订。
      - article [ref=e637]:
        - generic [aria-hidden] [ref=e638]: 🛒
        - heading "商超与日用" [level=3] [ref=e639]
        - paragraph [ref=e640]: 社区超市、便利店、药房与纪念品摊位均在步行数分钟范围内；需要更完整的购物选择时，往内陆方向稍走一段有大型商业中心。
      - article [ref=e641]:
        - generic [aria-hidden] [ref=e642]: ⛽
        - heading "加油与充电" [level=3] [ref=e643]
        - paragraph [ref=e644]: 加油站主要分布在城区主干道，海滨一线基本没有；部分内街商业停车场设有电动车充电位。自驾访客建议在进入这一片区前补足燃料，区内加油点稀少。
      - article [ref=e645]:
        - generic [aria-hidden] [ref=e646]: ♿
        - heading "无障碍通行" [level=3] [ref=e647]
        - paragraph [ref=e648]: 长廊主体平整、铺装完好且无台阶，路口设有缘石坡道，广场与步道之间为平接。个别低处观景平台需下台阶抵达，长廊也并非全程设有连续扶手，行动不便者建议结伴同行。
      - article [ref=e649]:
        - generic [aria-hidden] [ref=e650]: 🚰
        - heading "饮水与补水" [level=3] [ref=e651]
        - paragraph [ref=e652]: 附近商铺与摊位可购买瓶装水与饮料，直饮水设施并不连续。海岸日照比气温给人的感觉更强，12 月至次年 4 月尤其建议随身带水。
      - article [ref=e653]:
        - generic [aria-hidden] [ref=e654]: 🩺
        - heading "医疗与安全" [level=3] [ref=e655]
        - paragraph [ref=e656]: 区内分布有诊所与药房。秘鲁的紧急电话为：警察 105、消防 116、医疗急救（SAMU）106。崖下的海面不是游泳区，有暗流与礁石且没有救生员值守，请勿下海。
      - article [ref=e657]:
        - generic [aria-hidden] [ref=e658]: 📶
        - heading "通讯与网络" [level=3] [ref=e659]
        - paragraph [ref=e660]: 长廊沿线移动数据信号良好；部分公园与商业中心提供公共 Wi-Fi，但开放网络的安全性无法保证，建议避免在此类网络上进行敏感操作。
    - paragraph [ref=e662]: 公共空间的服务设施与开放安排会随时间调整，请把以下说明作为行程规划的参考，抵达后以现场信息为准。
